name: build

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build (tests + fat jar)
        run: ./gradlew --no-daemon test buildFatJar

      - name: Compute jar sha256
        run: |
          sha256sum build/libs/gatekeeperd-all.jar | awk '{print $1}' > build/libs/gatekeeperd-all.jar.sha256

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: gatekeeperd-all-jar
          path: |
            build/libs/gatekeeperd-all.jar
            build/libs/gatekeeperd-all.jar.sha256
          if-no-files-found: error
