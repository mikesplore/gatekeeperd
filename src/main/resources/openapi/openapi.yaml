      name: slug
      in: path
      required: true
      schema:
        type: string
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ContainerName:
      name: name
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    Health:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          example: ok
    Readiness:
      type: object
      properties:
        status:
          type: string
          enum:
          - ready
          - not_ready
        dependencies:
          type: object
          properties:
            database:
              type: boolean
            redis:
              type: boolean
            migrations:
              type: boolean
    VersionStatus:
      type: object
      properties:
        status:
          type: string
          enum:
          - up_to_date
          - update_available
          - deployment_failed
          - check_stale
          - unknown
        runningCommit:
          type: string
          nullable: true
        latestSuccessfulCommit:
          type: string
          nullable: true
        checkedAt:
          type: string
          format: date-time
          nullable: true
        upToDate:
          type: boolean
          nullable: true
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      properties:
        token:
          type: string
        refreshToken:
          type: string
    UserProfile:
      type: object
      properties:
        email:
          type: string
        role:
          type: string
        createdAt:
          type: string
          format: date-time
    ApiError:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
